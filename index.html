    --papier-l: #efe4d0;
    --papier-d: #dccbae;
    --plum:     #5c2745;
    --plum-l:   #7a3a5e;
    --tekst:    #4a1f39;
    --tekst-2:  #8b6a7c;
    --goud:     #c4aa62;
    --kaart-w: min(400px, 86vw, calc((100dvh - 300px) * 0.689));
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--papier) radial-gradient(90% 70% at 50% 40%, var(--papier-l) 0%, var(--papier) 55%, var(--papier-d) 100%);
    color: var(--tekst);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .podium {
    position: relative; z-index: 1;
    height: 100%;
    display: grid; align-content: center; justify-items: center; gap: 30px;
    padding: 0 16px 76px; box-sizing: border-box; /* onderaan ruimte voor het lieveheersbeestje */
  }

  /* ---------- Introtekst ---------- */
  .intro { text-align: center; max-width: min(34em, 92vw); display: grid; gap: 14px; }
  .intro h1 {
    margin: 0; font-weight: 400;
    font-family: 'Homemade Apple', 'Parisienne', cursive;
    font-size: clamp(17px, 4.6vw, 23px); line-height: 1.7;
    color: var(--plum); text-wrap: balance;
  }
  .intro p { margin: 0; font-size: clamp(17px, 4.4vw, 21px); line-height: 1.55; color: var(--tekst); text-wrap: balance; }
  .intro .slot { font-style: italic; color: var(--plum-l); margin-top: 4px; }
  .intro { transition: opacity .35s; }
  .podium.zoomt .intro { opacity: 0; }
  .podium.zoomt .tip { visibility: hidden; }
  .intro > * { animation: opkomen 1.3s ease both; }
  .intro > :nth-child(1) { animation-delay: .15s; }
  .intro > :nth-child(2) { animation-delay: .7s; }
  .intro > :nth-child(3) { animation-delay: 1.5s; }

  /* ---------- Het kaartje ---------- */
  /* Inzoomen: het vak houdt zijn plek in de pagina. Tijdens het zoomen wordt de zoomer als één geheel
     geschaald (--zs), zodat de letters niet verspringen; daarna wordt hij op ware grootte gezet (--zl), zodat alles scherp is. */
  .zoomvak { position: relative; z-index: 2; width: var(--kaart-w); aspect-ratio: 1030 / 1494; }
  .zoomer {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--kaart-w) * var(--zl, 1));
    transform: translate(calc(-50% + var(--px, 0px)), calc(-50% + var(--py, 0px))) scale(var(--zs, 1));
  }
  .zoomer.zacht { transition: transform .18s ease-out; }
  .podium.zoomt .flip { cursor: grab; }
  .scene { perspective: calc(1400px * var(--zl, 1)); width: 100%; animation: binnenkomst 1.6s 2s cubic-bezier(.22,.8,.2,1) both; }
  .tilt { transform-style: preserve-3d; will-change: transform; position: relative; }
  .lift { transform-style: preserve-3d; }
  .lift.los { animation: optillen 1.05s cubic-bezier(.35,.1,.2,1); }
  .flip {
    position: relative; aspect-ratio: 1030 / 1494;
    transform-style: preserve-3d;
    transition: transform 1.05s cubic-bezier(.35,.1,.2,1);
    cursor: pointer;
  }
  .flip:focus-visible { outline: 2px solid var(--plum); outline-offset: 10px; border-radius: 30px; }
  .flip.om { transform: rotateY(180deg); }
  @keyframes optillen { 50% { transform: translateZ(90px); } }
  .kant {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    container-type: inline-size; transform: translateZ(0);
    background-size: 100% 100%; background-repeat: no-repeat;
  }
  .voor  { background-image: var(--voor); }
  .achter { background-image: var(--achter); transform: rotateY(180deg) translateZ(0); }

  .glans {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,246,225,.22) 0%, rgba(255,246,225,.06) 22%, rgba(255,255,255,0) 50%);
    mix-blend-mode: soft-light; opacity: var(--go, 0);
    -webkit-mask: var(--voor) center / 100% 100% no-repeat;
    mask: var(--voor) center / 100% 100% no-repeat;
    transition: opacity .4s;
  }

  /* Tekst op de kaart in koel champagnegoud: lichte en donkere banen, zoals folie dat licht vangt. */
  .tekst {
    position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap;
    color: var(--goud);
    background: linear-gradient(172deg, #f3ecd6 0%, #d3bd7c 24%, #a9924f 46%, #e6d9ab 60%, #99834a 82%, #cdb977 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 calc(0.15 * var(--u, 1cqw)) calc(0.4 * var(--u, 1cqw)) rgba(30,8,22,.45));
    font-variant-numeric: lining-nums;
  }
  .tekst.klein { background: linear-gradient(175deg, #e8dcb0 0%, #c4aa62 45%, #97824a 100%); -webkit-background-clip: text; background-clip: text; }
  .naam-groot {
    top: 38.2%; font-size: calc(11.6 * var(--u, 1cqw)); font-weight: 500; letter-spacing: .14em; padding-left: .14em; line-height: 1;
  }
  .datum { top: 72.4%; font-size: calc(3 * var(--u, 1cqw)); line-height: 1.1; font-weight: 500; }
  .gedicht {
    top: 27.5%; font-family: 'Homemade Apple', 'Parisienne', cursive; font-size: calc(3.05 * var(--u, 1cqw)); letter-spacing: .01em;
  }
  .naam-vol { top: 34.4%; font-size: calc(8.7 * var(--u, 1cqw)); font-weight: 500; letter-spacing: .015em; line-height: 1; }
  .maten { top: 43.1%; font-size: calc(3.7 * var(--u, 1cqw)); line-height: 1.61; font-weight: 500; }
  .ouders { top: 72.2%; font-size: calc(3.15 * var(--u, 1cqw)); line-height: 1.43; font-weight: 500; }

  /* ---------- Lieveheersbeestje met tekstballon (rechtsonder) ---------- */
  .tip {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    display: flex; align-items: flex-end; gap: 6px; margin: 0;
    opacity: 0; transform: translateY(40px);
    transition: opacity .7s ease, transform .9s cubic-bezier(.22,.8,.2,1);
    pointer-events: none;
  }
  .tip.op { opacity: 1; transform: none; }
  .tip.stil { opacity: 0; transform: translateY(40px); transition-duration: .5s, .5s; }
  .ballon {
    position: relative; max-width: 150px; padding: 9px 12px 10px; margin-bottom: 26px;
    background: var(--papier-l); color: var(--plum);
    border: 1px solid rgba(92,39,69,.22); border-radius: 14px 14px 4px 14px;
    font-size: 15px; line-height: 1.3; font-style: italic; text-align: center; text-wrap: balance;
  }
  .ballon::after { /* staartje naar het beestje */
    content: ''; position: absolute; right: -7px; bottom: 8px; width: 11px; height: 11px;
    background: var(--papier-l); border-right: 1px solid rgba(92,39,69,.22); border-bottom: 1px solid rgba(92,39,69,.22);
    transform: rotate(-20deg) skewX(-20deg); border-radius: 0 0 2px 0;
  }
  .beestje { width: 54px; height: 54px; flex: none; transform-origin: 50% 90%; animation: wiebel 3.2s ease-in-out 1s infinite; }
  @keyframes wiebel { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }

  @keyframes opkomen { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes binnenkomst { from { opacity: 0; transform: translateY(40px) scale(.94); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .intro > *, .scene { animation-duration: .01s; animation-delay: 0s; }
    .tip { transition-duration: .01s; }
    .beestje { animation: none; }
    .flip { transition-duration: .3s; }
    .lift.los { animation: none; }
  }
  @media (max-height: 640px) {
    :root { --kaart-w: min(400px, 86vw, calc((100dvh - 230px) * 0.689)); }
    .podium { gap: 18px; }
    .intro { gap: 8px; }
    .intro p { font-size: 16px; line-height: 1.4; }
  }
</style>

<script>
(() => {
  const K = KAART;
  const $ = id => document.getElementById(id);
  const beperkt = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /* ---------- Teksten ---------- */
  const naamNet = K.naam.charAt(0) + K.naam.slice(1).toLowerCase();
  document.title = `${naamNet} is geboren`;
  $('titelTekst').textContent = K.gedichtje;
  $('introTekst').innerHTML = K.intro.map(esc).join('<br>');
  $('slotTekst').textContent = K.slot;
  $('slotTekst').hidden = !K.slot;
  $('tNaam').textContent = K.naam;
  $('tDatum').innerHTML = K.datum.map(d => `<div>${esc(d)}</div>`).join('');
  $('tGedicht').textContent = K.gedichtje;
  $('tVol').textContent = K.volledig;
  const maten = [K.datumVol, K.tijd,K.gewicht.replace(/ {2,}/g, '&nbsp;&nbsp;'), K.lengte].filter(Boolean);
  $('tMaten').innerHTML = maten.map(d => `<div>${d}</div>`).join('');
  $('tMaten').style.paddingTop = (3 - maten.length) * 0.805 + 'em';   // minder regels: blok blijft op dezelfde hoogte gecentreerd
  $('tOuders').innerHTML = [K.ouders, K.adres, K.telefoon].map(d => `<div>${esc(d)}</div>`).join('');

  /* ---------- Kantelen met cursor en vinger ---------- */
  const tilt = $('tilt'), flip = $('flip'), scene = $('scene'), lift = $('lift');
  const glansV = $('glansVoor'), glansA = $('glansAchter'), tip = $('tip');
  const MAX = 13;
  let doelX = 0, doelY = 0, curX = 0, curY = 0, wijzer = false, om = false;
  let glansX = 50, glansY = 50, glansO = 0;

  function zetDoelVanPunt(px, py) {
    const r = scene.getBoundingClientRect();
    const nx = ((px - r.left) / r.width) * 2 - 1, ny = ((py - r.top) / r.height) * 2 - 1;
    const kx = Math.max(-1.3, Math.min(1.3, nx)), ky = Math.max(-1.3, Math.min(1.3, ny));
    doelY = kx * MAX; doelX = -ky * MAX;
    glansX = (kx + 1) * 50; glansY = (ky + 1) * 50; glansO = 1;
  }

  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    wijzer = true; zetDoelVanPunt(e.clientX, e.clientY);
  }, { passive: true });
  document.addEventListener('mouseleave', () => { wijzer = false; glansO = 0; });

  /* ---------- In- en uitzoomen: knijpen, scrollen of + / − / 0; slepen om te verschuiven ---------- */
  const zoomvak = $('zoomvak'), zoomer = $('zoomer'), podium = document.querySelector('.podium');
  const ZMAX = 3, RAND = 20;
  let z = 1, zl = 1, px = 0, py = 0, vastTimer = 0;
  // --u = 1% van de kaartbreedte in px; vaste px-maten i.p.v. cqw, want die lopen op mobiel achter bij het zoomen
  function zetMaat() { zoomer.style.setProperty('--u', (zoomvak.getBoundingClientRect().width * zl / 100).toFixed(3) + 'px'); }
  zetMaat();
  function zetVast() { // na het zoomen: op ware grootte opmaken
    zl = z; zoomer.classList.remove('zacht'); zetMaat();
    zoomer.style.setProperty('--zl', zl.toFixed(4)); zoomer.style.setProperty('--zs', 1);
  }
  function zetZoom(nz, fx, fy, dx = 0, dy = 0, zacht = false) {
    const r = zoomvak.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    nz = Math.max(1, Math.min(ZMAX, nz));
    if (fx == null) { fx = cx + px; fy = cy + py; }
    // het punt onder de vingers/cursor blijft op zijn plek
    px = fx - cx - (nz / z) * (fx - cx - px) + dx;
    py = fy - cy - (nz / z) * (fy - cy - py) + dy;
    z = nz;
    if (z <= 1.001) { z = 1; px = py = 0; }
    else {
      const klem = (v, a, b) => Math.max(Math.min(a, b), Math.min(Math.max(a, b), v));
      const w = r.width * z, h = r.height * z;
      px = klem(px, RAND + w / 2 - cx, innerWidth - RAND - w / 2 - cx);
      py = klem(py, RAND + h / 2 - cy, innerHeight - RAND - h / 2 - cy);
    }
    zoomer.classList.toggle('zacht', zacht);
    zoomer.style.setProperty('--zs', (z / zl).toFixed(5));
    clearTimeout(vastTimer);
    if (z !== zl) vastTimer = setTimeout(zetVast, 350);
    zoomer.style.setProperty('--px', px.toFixed(1) + 'px');
    zoomer.style.setProperty('--py', py.toFixed(1) + 'px');
    podium.classList.toggle('zoomt', z > 1);
  }
  addEventListener('wheel', e => {
    e.preventDefault();
    zetZoom(z * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)), e.clientX, e.clientY, 0, 0, !e.ctrlKey);
  }, { passive: false });
  addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') zetZoom(z * 1.3, null, null, 0, 0, true);
    else if (e.key === '-' || e.key === '_') zetZoom(z / 1.3, null, null, 0, 0, true);
    else if (e.key === '0' || e.key === 'Escape') zetZoom(1, null, null, 0, 0, true);
  });
  addEventListener('resize', () => { zetMaat(); zetZoom(z); });

  let tStartX = 0, tStartY = 0, tBewogen = false, vorige = null;
  const knijp = ts => ({
    x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2,
    d: Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY) || 1,
  });
  addEventListener('touchstart', e => {
    if (e.touches.length > 1) { tBewogen = true; vorige = knijp(e.touches); wijzer = false; glansO = 0; return; }
    const t = e.touches[0]; tStartX = t.clientX; tStartY = t.clientY; tBewogen = false;
    vorige = { x: t.clientX, y: t.clientY };
    wijzer = true; zetDoelVanPunt(t.clientX, t.clientY);
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (e.touches.length > 1) {
      const k = knijp(e.touches);
      if (vorige && vorige.d) zetZoom(z * k.d / vorige.d, k.x, k.y, k.x - vorige.x, k.y - vorige.y);
      vorige = k; tBewogen = true; return;
    }
    const t = e.touches[0];
    if (Math.hypot(t.clientX - tStartX, t.clientY - tStartY) > 10) tBewogen = true;
    if (z > 1 && vorige && !vorige.d) zetZoom(z, null, null, t.clientX - vorige.x, t.clientY - vorige.y);
    vorige = { x: t.clientX, y: t.clientY };
    zetDoelVanPunt(t.clientX, t.clientY);
  }, { passive: true });
  addEventListener('touchend', e => {
    vorige = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    wijzer = false; glansO = 0;
  }, { passive: true });

  let sleep = null; // met de muis slepen als er is ingezoomd
  addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || e.button !== 0) return;
    tBewogen = false; sleep = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
  });
  addEventListener('pointermove', e => {
    if (!sleep || e.pointerType === 'touch') return;
    if (Math.hypot(e.clientX - sleep.sx, e.clientY - sleep.sy) > 5) tBewogen = true;
    if (z > 1) zetZoom(z, null, null, e.clientX - sleep.x, e.clientY - sleep.y);
    sleep.x = e.clientX; sleep.y = e.clientY;
  });
  addEventListener('pointerup', () => { sleep = null; });
  addEventListener('pointercancel', () => { sleep = null; });


  const tipTimer = setTimeout(() => tip.classList.add('op'), beperkt ? 300 : 3600); // komt op na het kaartje
  function draaiOm() {
    om = !om; flip.classList.toggle('om', om);
    lift.classList.remove('los'); void lift.offsetWidth; lift.classList.add('los');
    tip.classList.add('stil'); clearTimeout(tipTimer);
  }
  flip.addEventListener('click', () => { if (tBewogen) { tBewogen = false; return; } draaiOm(); });
  flip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); draaiOm(); } });

  const t00 = performance.now();
  function anim(t) {
    const rust = beperkt ? 0 : 1, s = (t - t00) / 1000;
    const idleX = Math.sin(s * .55) * 2.2 * rust, idleY = Math.sin(s * .4 + 1) * 3 * rust; // langzaam ademen
    const tx = wijzer ? doelX : idleX, ty = wijzer ? doelY : idleY;
    curX += (tx - curX) * .07; curY += (ty - curY) * .07;
    tilt.style.transform = `rotateX(${curX.toFixed(2)}deg) rotateY(${curY.toFixed(2)}deg)`;
    const g = om ? glansA : glansV, gx = om ? 100 - glansX : glansX;
    g.style.setProperty('--gx', gx + '%'); g.style.setProperty('--gy', glansY + '%'); g.style.setProperty('--go', glansO);
    (om ? glansV : glansA).style.setProperty('--go', 0);
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
})();
</script>
